<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Профиль | Music Diary</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <header class="sidebar-header">
          <div class="logo">
            <span class="logo-mark">♪</span>
            <span class="logo-text">Music Diary</span>
          </div>
        </header>

        <nav class="sidebar-nav" aria-label="Навигация по сайту">
          <a href="../index.html" class="nav-link">Поиск</a>
          <a href="collection.html" class="nav-link">Коллекция</a>
          <a href="diary.html" class="nav-link">Дневник</a>
          <a href="memories.html" class="nav-link">Воспоминания</a>
          <a href="stats.html" class="nav-link">Статистика</a>
          <a href="profile.html" class="nav-link active">Профиль</a>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="page-header">
          <h1>Профиль</h1>
        </header>

        <section class="content-block">
          <div class="profile-card">
            <div class="avatar">A</div>
            <div class="profile-meta">
              <h2>Алина Петрова</h2>
              <p>music.diary.user@example.com</p>
            </div>
          </div>

          <form class="profile-form">
            <div class="form-grid">
              <div class="form-field">
                <label for="name">Имя</label>
                <input id="name" type="text" value="Алина" />
              </div>

              <div class="form-field">
                <label for="email">E-mail</label>
                <input id="email" type="email" value="music.diary.user@example.com" />
              </div>

              <div class="form-field">
                <label for="password">Пароль</label>
                <input id="password" type="password" value="password123" />
              </div>

              <div class="form-field">
                <label for="city">Город</label>
                <input id="city" type="text" value="Москва" />
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="primary-button">Сохранить изменения</button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
