<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Профиль | Music Diary</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <header class="sidebar-header">
          <div class="logo">
            <span class="logo-mark">♪</span>
            <span class="logo-text">Music Diary</span>
          </div>
        </header>

        <nav class="sidebar-nav" aria-label="Навигация по сайту">
          <a href="../index.html" class="nav-link">Поиск</a>
          <a href="collection.html" class="nav-link">Коллекция</a>
          <a href="diary.html" class="nav-link">Дневник</a>
          <a href="memories.html" class="nav-link">Воспоминания</a>
          <a href="stats.html" class="nav-link">Статистика</a>
          <a href="profile.html" class="nav-link active">Профиль</a>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="page-header">
          <h1>Профиль</h1>
        </header>

        <section class="content-block">
          <div class="profile-card">
            <div class="avatar">A</div>
            <div class="profile-meta">
              <h2>Алина М.</h2>
              <p>Слушает: indie pop, synthwave, dream pop</p>
            </div>
          </div>

          <form class="profile-form">
            <div class="form-grid">
              <div class="form-field">
                <label for="profile-name">Имя</label>
                <input id="profile-name" type="text" value="Алина" />
              </div>

              <div class="form-field">
                <label for="profile-email">Email</label>
                <input id="profile-email" type="email" value="alina@example.com" />
              </div>

              <div class="form-field full-width">
                <label for="profile-bio">О себе</label>
                <textarea id="profile-bio" rows="5">Люблю треки, которые напоминают вечерний город и легкую ностальгию.</textarea>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="primary-button">Сохранить</button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
