<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Коллекция | Music Diary</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <header class="sidebar-header">
          <div class="logo">
            <span class="logo-mark">♪</span>
            <span class="logo-text">Music Diary</span>
          </div>
        </header>

        <nav class="sidebar-nav" aria-label="Навигация по сайту">
          <a href="../index.html" class="nav-link">Поиск</a>
          <a href="collection.html" class="nav-link active">Коллекция</a>
          <a href="diary.html" class="nav-link">Дневник</a>
          <a href="memories.html" class="nav-link">Воспоминания</a>
          <a href="stats.html" class="nav-link">Статистика</a>
          <a href="profile.html" class="nav-link">Профиль</a>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="page-header">
          <h1>Коллекция</h1>
        </header>

        <section class="content-block">
          <div class="cards-grid">
            <article class="track-card">
              <div class="track-cover cover-1"></div>
              <div class="track-body">
                <span class="tag">Indie pop</span>
                <h3>Midnight Echo</h3>
                <p>Moonlight Avenue</p>
                <div class="meta">
                  <span>★ 9.4</span>
                  <span>3:42</span>
                </div>
              </div>
            </article>

            <article class="track-card">
              <div class="track-cover cover-2"></div>
              <div class="track-body">
                <span class="tag">Dream pop</span>
                <h3>Glass Horizon</h3>
                <p>Velvet Noise</p>
                <div class="meta">
                  <span>★ 9.1</span>
                  <span>4:08</span>
                </div>
              </div>
            </article>

            <article class="track-card">
              <div class="track-cover cover-3"></div>
              <div class="track-body">
                <span class="tag">Synthwave</span>
                <h3>Neon Skyline</h3>
                <p>Static Rooms</p>
                <div class="meta">
                  <span>★ 9.7</span>
                  <span>3:56</span>
                </div>
              </div>
            </article>

            <article class="track-card">
              <div class="track-cover cover-4"></div>
              <div class="track-body">
                <span class="tag">Alternative</span>
                <h3>Velvet Rain</h3>
                <p>Night Bloom</p>
                <div class="meta">
                  <span>★ 8.9</span>
                  <span>4:21</span>
                </div>
              </div>
            </article>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
