<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Поиск | Music Diary</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <header class="sidebar-header">
          <div class="logo">
            <span class="logo-mark">♪</span>
            <span class="logo-text">Music Diary</span>
          </div>
        </header>

        <nav class="sidebar-nav" aria-label="Навигация по сайту">
          <a href="../index.html" class="nav-link active">Поиск</a>
          <a href="collection.html" class="nav-link">Коллекция</a>
          <a href="diary.html" class="nav-link">Дневник</a>
          <a href="memories.html" class="nav-link">Воспоминания</a>
          <a href="stats.html" class="nav-link">Статистика</a>
          <a href="profile.html" class="nav-link">Профиль</a>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="page-header">
          <h1>Поиск</h1>
        </header>

        <section class="content-block">
          <label for="search-query" class="search-label">Введите запрос</label>
          <input
            id="search-query"
            class="search-input"
            type="search"
            placeholder="Найдите трек, исполнителя или жанр"
          />

          <div id="search-results" class="search-results"></div>
        </section>
      </main>
    </div>

    <script src="../js/main.js"></script>
  </body>
</html>
